name: Importar site original
on:
  push:
    paths:
      - '.github/workflows/importar-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar página e imagens originais
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://protocolodesinflama40.netlify.app/protocolo-desinflama-40.html' -o index.html
          python3 - <<'PY'
          import re, pathlib, urllib.request, hashlib
          p=pathlib.Path("index.html")
          html=p.read_text()
          html=re.sub(r'<!-- This site is hosted on Netlify.*?-->(?:\n)?','',html,flags=re.S)
          html=re.sub(r'<script async src="/\.netlify/scripts/hud[^>]*></script>','',html)
          if html.endswith("\n\n"): html=html[:-1]
          p.write_text(html)
          expected="5385ece7bb2e80f69b7729853fa7ff3c1207e12c8d56b7b51fc96682e5d47304"
          if hashlib.sha256(p.read_bytes()).hexdigest()!=expected: raise RuntimeError("HTML original diferente: importação cancelada")
          files=set(re.findall(r'(?:src/assets/images|assets/aistudio)/[^"\'\s>)]+',html))
          print("Imagens:",len(files))
          for name in sorted(files):
              dest=pathlib.Path(name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              urllib.request.urlretrieve('https://protocolodesinflama40.netlify.app/'+name,dest)
              if dest.stat().st_size<1000: raise RuntimeError("Imagem muito pequena: "+name)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/assets/images assets/aistudio
          git commit -m "Importar site original completo" || exit 0
          git push
