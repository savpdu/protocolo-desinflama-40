name: Otimizar imagens novas para publicacao
on:
  push:
    paths:
      - '.github/workflows/otimizar-imagens-novas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Criar copias WebP com alta qualidade das novas imagens
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ['image_1ad67ebf.png','Mulher_mostra_e-book_enquanto_escreve_e87d3e52.png']:
              src=Path('assets/aistudio')/name
              dest=src.with_suffix('.webp')
              with Image.open(src) as image:
                  image.save(dest, 'WEBP', quality=97, method=6)
              print(str(dest),dest.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/aistudio/*.webp
          git commit -m 'Preparar imagens novas para Vercel em WebP' || exit 0
          git push
