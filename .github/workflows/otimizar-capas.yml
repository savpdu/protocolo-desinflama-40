name: Otimizar capas para Vercel
on:
  push:
    paths:
      - '.github/workflows/otimizar-capas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 -m pip install --quiet Pillow
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path('assets/aistudio').glob('*.png')):
              im=Image.open(path).convert('RGB')
              dest=path.with_suffix('.webp')
              im.save(dest, 'WEBP', quality=90, method=6)
              print(dest, dest.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aistudio/*.webp
          git commit -m "Adicionar versões WebP otimizadas das capas" || exit 0
          git push
